<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mahjong Points Tracker</title>
    <meta name="description" content="A offline-capable Mahjong points calculator.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#064e3b">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <div class="top-actions">
            <button id="btn-lang" class="btn-icon">中/EN</button>
        </div>
        <!-- Setup Screen -->
        <section id="setup-screen" class="screen">
            <header>
                <h1>Mahjong<span>Tracker</span></h1>
                <p data-i18n="setup_desc">New Game Setup</p>
            </header>
            <form id="setup-form">
                <div class="input-group">
                    <label>
                        <span data-i18n="players">Players</span>
                        <span style="font-size: 0.8em; font-weight: normal; margin-left: 8px; color: var(--text-muted);" data-i18n="players_order_disclaimer">(Please arrange in order)</span>
                    </label>
                    <div style="display: flex; gap: 10px; margin-bottom: 2px; font-size: 0.7rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase;">
                        <span style="width: 50px; text-align: center; line-height: 1.2;" data-i18n="initial_dealer">Initial Dealer</span>
                        <span></span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
                        <div style="width: 50px; text-align: center;"><input type="radio" name="initial-dealer" value="0" checked title="Initial Dealer" style="width: auto; transform: scale(1.2);"></div>
                        <input type="text" id="player1" required data-i18n-placeholder="p1_name" placeholder="Player 1" style="flex: 1;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
                        <div style="width: 50px; text-align: center;"><input type="radio" name="initial-dealer" value="1" title="Initial Dealer" style="width: auto; transform: scale(1.2);"></div>
                        <input type="text" id="player2" required data-i18n-placeholder="p2_name" placeholder="Player 2" style="flex: 1;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
                        <div style="width: 50px; text-align: center;"><input type="radio" name="initial-dealer" value="2" title="Initial Dealer" style="width: auto; transform: scale(1.2);"></div>
                        <input type="text" id="player3" required data-i18n-placeholder="p3_name" placeholder="Player 3" style="flex: 1;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
                        <div style="width: 50px; text-align: center;"><input type="radio" name="initial-dealer" value="3" title="Initial Dealer" style="width: auto; transform: scale(1.2);"></div>
                        <input type="text" id="player4" required data-i18n-placeholder="p4_name" placeholder="Player 4" style="flex: 1;">
                    </div>
                </div>
                <div class="input-group">
                    <label data-i18n="base_score">Base Score</label>
                    <input type="number" id="base-score" value="5" required min="1">
                </div>
                <button type="submit" class="btn-primary" data-i18n="start_game">Start Game</button>
            </form>
        </section>

        <!-- Game Screen -->
        <section id="game-screen" class="screen hidden">
            <header class="game-header">
                <div class="round-info">
                    <span class="label" data-i18n="round">ROUND</span>
                    <span id="display-round-num" class="value">1</span>
                </div>
                <div class="dealer-info">
                    <span class="label" data-i18n="dealer">DEALER</span>
                    <span id="display-dealer-name" class="value">Player A</span>
                    <span id="display-lian-zhuang" class="badge hidden">Lian 1</span>
                </div>
            </header>

            <div class="scoreboard-card">
                <div id="scoreboard-grid" class="scoreboard-grid">
                    <!-- Players injected here -->
                </div>
            </div>

            <div class="actions">
                <button id="btn-next-round" class="btn-primary" data-i18n="end_round">End Round</button>
                <button id="btn-end-game" class="btn-secondary" data-i18n="end_session">End Session</button>
            </div>

            <div class="history-section">
                <h3 data-i18n="history">Round History</h3>
                <div id="round-history-list" class="history-list">
                    <!-- History items injected here -->
                </div>
            </div>
        </section>

        <!-- Round End Modal -->
        <div id="round-modal" class="modal hidden">
            <div class="modal-content">
                <h2 data-i18n="round_results">Round Results</h2>
                <form id="round-form">
                    <div class="modal-group">
                        <label data-i18n="who_won">Who won?</label>
                        <div id="winner-select" class="player-select-grid">
                            <!-- Winner options injected here -->
                        </div>
                    </div>
                    
                    <div class="modal-group">
                        <label data-i18n="multiplier">Multiplier</label>
                        <div class="multiplier-input">
                            <button type="button" class="btn-step" onclick="this.nextElementSibling.stepDown()">-</button>
                            <input type="number" id="input-multiplier" value="1" min="1">
                            <button type="button" class="btn-step" onclick="this.previousElementSibling.stepUp()">+</button>
                        </div>
                    </div>

                    <div class="modal-group">
                        <label data-i18n="field_points">Field Points (Gold/Flowers/Kongs)</label>
                        <div id="field-points-inputs" class="field-points-grid">
                            <!-- FP inputs injected here -->
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button" id="btn-cancel-round" class="btn-secondary" data-i18n="cancel">Cancel</button>
                        <button type="submit" class="btn-primary" data-i18n="calculate">Calculate</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Update Notification -->
    <div id="update-toast" class="update-toast hidden">
        <span data-i18n="update_available">New version available!</span>
        <button id="btn-update" class="btn-update" data-i18n="update_now">Update Now</button>
    </div>

    <script src="calculator.js"></script>
    <script src="main.js"></script>
</body>
</html>
